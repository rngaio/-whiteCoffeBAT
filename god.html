<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmation's Burger OBS Overlay</title>
  
  <!-- Tailwind CSS CDN for smooth layout styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Modern rounded sans-serif font for stream readability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  
  <style>
    /* Reset & Transparent Canvas Configuration for OBS Studio */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 1920px;
      height: 1080px;
      background-color: transparent !important; /* OBS Browser Source transparent background */
      overflow: hidden;
      font-family: 'Fredoka', 'Inter', sans-serif;
    }

    /* BURGER STYLING & ANIMATIONS */
    .burger-container {
      filter: drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.45));
    }

    /* 1. TOP BUN STYLING */
    .top-bun {
      background: linear-gradient(180deg, #E28C38 0%, #C46D21 100%);
      border: 4px solid #7C3E08;
      border-radius: 90px 90px 15px 15px;
      position: relative;
      box-shadow: inset 0 8px 12px rgba(255, 255, 255, 0.3);
    }
    
    /* Sesame Seeds */
    .sesame {
      position: absolute;
      background: #FFFDF0;
      width: 14px;
      height: 7px;
      border-radius: 50%;
      transform: rotate(-15deg);
      box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    /* 2. LETTUCE LAYER STYLING */
    .lettuce-layer {
      background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
      border: 4px solid #1B5E20;
      border-radius: 18px;
      position: relative;
    }
    
    /* Wavy Scallop Effect for Lettuce */
    .lettuce-wavy {
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 16px;
      background-image: radial-gradient(circle at 10px 0, #4CAF50 12px, transparent 13px);
      background-size: 24px 20px;
      background-repeat: repeat-x;
    }

    /* 3. CHEESE LAYER STYLING */
    .cheese-layer {
      background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
      border: 4px solid #E65100;
      border-radius: 16px;
      position: relative;
    }

    .cheese-drip {
      position: absolute;
      bottom: -16px;
      left: 40px;
      width: 28px;
      height: 20px;
      background: #FFB300;
      border-left: 4px solid #E65100;
      border-right: 4px solid #E65100;
      border-bottom: 4px solid #E65100;
      border-radius: 0 0 14px 14px;
      z-index: 10;
    }

    /* 4. MEAT PATTY LAYER STYLING */
    .patty-layer {
      background: linear-gradient(135deg, #5D4037 0%, #3E2723 100%);
      border: 4px solid #1B0000;
      border-radius: 20px;
    }

    /* 5. KETCHUP / SAUCE SLICE */
    .ketchup-drip-line {
      background: #D32F2F;
      border: 3px solid #8B0000;
      border-radius: 12px;
    }

    /* 6. BOTTOM BUN STYLING */
    .bottom-bun {
      background: linear-gradient(180deg, #C46D21 0%, #9E4F0C 100%);
      border: 4px solid #5C2A03;
      border-radius: 12px 12px 45px 45px;
    }

    /* Content Cards inside layers */
    .info-card {
      background: rgba(18, 18, 28, 0.65);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #FFFFFF;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    
    /* Glowing text effects for headers */
    .text-glow {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="flex items-center justify-start p-16">
 

  <!-- ========================================== -->
  <!-- MAIN BURGER OVERLAY WRAPPER               -->
  <!-- ========================================== -->
  <div class="burger-container w-[720px] flex flex-col gap-2 relative select-none">
    
    <!-- ---------------------------------------- -->
    <!-- 1. TOP BUN LAYER (Header Title)           -->
    <!-- ---------------------------------------- -->
    <div class="top-bun h-24 w-full flex items-center justify-center relative">
      <!-- Decorative Sesame Seeds -->
      <div class="sesame top-4 left-16"></div>
      <div class="sesame top-8 left-36 transform rotate-12"></div>
      <div class="sesame top-5 left-72 transform -rotate-45"></div>
      <div class="sesame top-9 right-40 transform rotate-45"></div>
      <div class="sesame top-4 right-16"></div>
 
      <!-- Main Overlay Title -->
      <h3 class="text-3xl font-bold text-white text-glow tracking-wider uppercase flex items-center gap-2">
        Burger
      </h3>
    </div>

    <!-- ---------------------------------------- -->
    <!-- 2. LETTUCE LAYER (Socials / Handles)     -->
    <!-- ---------------------------------------- -->
    <div class="lettuce-layer p-3 w-full flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2 text-white font-bold text-xl px-3 min-w-[150px] text-glow">
        <svg class="w-6 h-6 fill-current text-green-200" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        <span>Socials :</span>
      </div>

      <!-- Blank Stream Info Space (Edit text here or display via OBS text source) -->
      <div id="Socials-info" class="info-card flex-1 h-12 flex items-center px-4 font-semibold text-lg text-green-100">
        <!-- Customize your social handles below -->
        <span class="truncate"> Twitch: Boulcair &bull; Instagram: @ric.boulcair &bull; Tiktok: watchrv</span>
      </div>

      <!-- Decorative Lettuce Bottom Edge -->
      <div class="lettuce-wavy"></div>
    </div>

    <!-- ---------------------------------------- -->
    <!-- 3. CHEESE LAYER (Flash Info / Announcement) -->
    <!-- ---------------------------------------- -->
    <div class="cheese-layer p-3 w-full flex items-center justify-between shadow-md">
      <!-- Decorative Cheese Drip -->
      <div class="cheese-drip"></div>

      <div class="flex items-center gap-2 text-amber-950 font-bold text-xl px-3 min-w-[150px] text-glow">
        <span>⚡ Cheesy Info :</span>
      </div>

      <!-- Blank Stream Info Space for Announcements/Goals -->
      <div id="Flash-News" class="info-card flex-1 h-12 flex items-center px-4 font-semibold text-lg text-amber-200">
        <!-- Customize stream goal/news text here -->
        <span class="truncate"> New Follower Goal: 4 / 10 | Today News: Meet & Greet !</span>
      </div>
    </div>

    <!-- ---------------------------------------- -->
    <!-- 4. MEAT PATTY LAYER (Date & Live Clock)   -->
    <!-- ---------------------------------------- -->
    <div class="patty-layer p-3 w-full flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2 text-amber-100 font-bold text-xl px-3 min-w-[150px] text-glow">
        <svg class="w-6 h-6 fill-current text-amber-400" viewBox="0 0 24 24">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
        </svg>
        <span>Date & Time :</span>
      </div>

      <!-- Dynamic JS Live Clock Container -->
      <div id="Meat-Date" class="info-card flex-1 h-12 flex items-center justify-between px-4 font-semibold text-lg text-amber-100">
        <span id="current-date">Loading date...</span>
        <span id="current-time" class="font-mono bg-black/40 px-3 py-1 rounded text-amber-300">00:00:00</span>
      </div>
    </div>

    <!-- ---------------------------------------- -->
    <!-- 5. KETCHUP / SAUCE SLICE                  -->
    <!-- ---------------------------------------- -->
    <div class="ketchup-drip-line h-3 w-[94%] mx-auto -my-1 z-10"></div>

    <!-- ---------------------------------------- -->
    <!-- 6. BOTTOM BUN LAYER                      -->
    <!-- ---------------------------------------- -->
    <div class="bottom-bun h-10 w-full flex items-center justify-center">
      <div class="w-24 h-1.5 bg-amber-200/30 rounded-full"></div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT: LIVE TIME & DATE AUTOMATION    -->
  <!-- ========================================== -->
   <script src="regular.js"></script>
  <script>
    // Updates the live Date and Time inside the Patty layer continuously
    function updateClock() {
      const now = new Date();

      // Format Date (e.g., Wednesday, Nov 11, 2026)
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      const dateString = now.toLocaleDateString('en-US', options);

      // Format Time (HH:MM:SS)
      const timeString = now.toLocaleTimeString('en-US', { hour12: false });

      // Update DOM elements safely
      const dateEl = document.getElementById('current-date');
      const timeEl = document.getElementById('current-time');

      if (dateEl) dateEl.textContent = dateString;
      if (timeEl) timeEl.textContent = timeString;
    }

    // Initialize clock immediately & update every second
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
